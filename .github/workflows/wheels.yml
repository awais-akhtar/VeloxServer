name: wheels

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native core
        shell: bash
        run: |
          cd native/rust
          cargo build --release
          cd ../..
          mkdir -p src/veloxserver/native_libs
          cp native/rust/target/release/libveloxcore.so src/veloxserver/native_libs/ 2>/dev/null || true
          cp native/rust/target/release/libveloxcore.dylib src/veloxserver/native_libs/ 2>/dev/null || true
          cp native/rust/target/release/veloxcore.dll src/veloxserver/native_libs/ 2>/dev/null || true
      - name: Build wheel
        env:
          VELOXSERVER_BINARY_WHEEL: "1"
        run: |
          python -m pip install build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl
