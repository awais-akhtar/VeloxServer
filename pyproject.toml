[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veloxserver"
version = "0.1.0"
description = "VeloxServer: a clean-room, pip-installable HTTP gateway with static, proxy, stream, and AI model routes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Awais" }
]
keywords = ["http", "server", "webserver", "reverse-proxy", "gateway", "http2", "http3", "ai", "self-healing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers"
]
dependencies = [
  "h2>=4.1,<5",
  "aioquic>=1.2,<2",
  "cryptography>=42,<47"
]

[project.scripts]
veloxserver = "veloxserver.cli:main"

[project.urls]
Homepage = "https://github.com/awais-akhtar/VeloxServer"
Repository = "https://github.com/awais-akhtar/VeloxServer"
Issues = "https://github.com/awais-akhtar/VeloxServer/issues"

[project.optional-dependencies]
ai-transformers = ["transformers>=4", "torch>=2"]
ai-llama = ["llama-cpp-python>=0.2"]
ai-repair = ["openai>=1.0"]
ai = ["transformers>=4", "torch>=2", "llama-cpp-python>=0.2"]
all-ai = ["transformers>=4", "torch>=2", "llama-cpp-python>=0.2", "openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veloxserver = ["native_libs/*"]

[tool.cibuildwheel]
test-command = "python -B -c \"import veloxserver; print(veloxserver.__version__)\""
